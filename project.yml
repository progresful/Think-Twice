name: ThinkTwice
options:
  bundleIdPrefix: app.thinktwice
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ThinkTwice:
    type: application
    platform: iOS
    sources: [ThinkTwice]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.thinktwice.demo
        PRODUCT_NAME: ThinkTwice
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Think Twice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: [ThinkTwiceTests]
  ThinkTwiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ThinkTwiceTests]
    dependencies:
      - target: ThinkTwice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: app.thinktwice.demo.tests
