<style>

  .glow { position: absolute; right: -200px; top: -200px; width: 1500px; height: 1500px; border-radius: 50%;

  .brand { position: absolute; left: 110px; top: 110px; display: flex; align-items: center; gap: 30px;
    font-size: 64px; font-weight: 800; letter-spacing: -.03em; }
  .brand img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { position: absolute; left: 104px; top: 318px; font-size: 168px; line-height: .98; font-weight: 800; letter-spacing: -.055em; }
  h1 span { display: inline-block; white-space: nowrap; font-size: 118px; letter-spacing: -.045em; margin: 44px 0 0 -6px; background: #9BF05C; color: #06140A; border-radius: 26px; padding: 10px 30px 20px;
    transform: rotate(-2deg); }
  p { position: absolute; left: 110px; top: 880px; font-size: 54px; font-weight: 600; letter-spacing: -.02em; color: rgba(255,255,255,.72); }
  p b { color: #9BF05C; font-weight: 700; }
  img.shot { position: absolute; height: 1010px; border-radius: 60px; box-shadow: 0 0 0 3px rgba(255,255,255,.16), 0 50px 140px rgba(0,0,0,.75); }
  .a { left: 1040px; top: 130px; transform: rotate(-5deg); }
  .b { left: 1420px; top: 44px; transform: rotate(4deg); }
  .say { position: absolute; left: 905px; top: 610px; background: #fff; color: #06140A; font-size: 50px; font-weight: 800; letter-spacing: -.03em;
    padding: 20px 34px 24px; border-radius: 34px 34px 34px 6px; transform: rotate(-5deg); box-shadow: 0 24px 60px rgba(0,0,0,.6); }
</style>
