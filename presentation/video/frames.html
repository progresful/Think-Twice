<!doctype html>
<meta charset="utf-8">
<title>Think Twice video frame</title>
<style>
  :root { --lime: #9BF05C; --sub: rgba(255,255,255,.6); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; right: -200px; top: -200px; width: 1200px; height: 1200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(155,240,92,.16), transparent 62%); }
  .brand { position: absolute; left: 120px; top: 96px; display: flex; align-items: center; gap: 16px;
    font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .dot { width: 56px; height: 56px; border-radius: 14px; }
  .bar { position: absolute; left: 120px; bottom: 60px; width: 1040px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--lime); }
  h1 { position: absolute; left: 120px; top: 300px; width: 1040px; font-size: 104px; line-height: 1.02;
    font-weight: 800; letter-spacing: -.04em; text-wrap: balance; }
  h1 b { color: var(--lime); font-weight: 800; }
  .cap { position: absolute; left: 120px; bottom: 120px; width: 1040px; font-size: 40px; line-height: 1.3; color: var(--sub);
    text-wrap: pretty; }
  .phone { position: absolute; left: 1286px; top: 46px; width: 470px; height: 988px; border-radius: 40px; background: #1C1C1E;
    box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 40px 120px rgba(0,0,0,.6); }
</style>
<div class="glow"></div>
<div class="brand"><img class="dot" src="../../ThinkTwice/Assets.xcassets/AppIcon.appiconset/icon-1024.png" alt="">Think Twice</div>
<h1 id="h"></h1>
<p class="cap" id="c"></p>
<div class="phone"></div>
<div class="bar"><i id="b"></i></div>
<script src="segments.js"></script>
<script>
  const n = +new URLSearchParams(location.search).get('i') || 0, s = SEGMENTS[n];
  document.getElementById('b').style.width = ((n + 1) / SEGMENTS.length * 100) + '%';
  document.getElementById('h').innerHTML = s.headline;
  document.getElementById('c').textContent = s.caption;
</script>
